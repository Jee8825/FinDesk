# FinDesk Backend API — OpenAPI 3.1 (v1 skeleton)
# Source of truth for the REST + SSE surface. `make contracts` generates the
# Pydantic models (shared/py) and the TS client (shared/ts) from this file.
# Endpoint set mirrors docs/architecture/06-backend-api.md §2 — flesh out
# schemas as features land; CI lints this file and fails on generator drift.

openapi: 3.1.0
info:
  title: FinDesk API
  version: 1.0.0
  description: >
    Control plane for the autonomous CFO. All endpoints are tenant-scoped via
    the access token's active-tenant claim. Money is integer paise; timestamps
    UTC ISO-8601; IDs UUIDv7.

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: books
  - name: agent
  - name: conflicts
  - name: anomalies
  - name: approvals
  - name: cash
  - name: ims
  - name: why
  - name: webhooks

paths:
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Email+password login (optional TOTP step-up)
      responses: { "200": { description: tokens } }
  /auth/refresh:
    post: { tags: [auth], security: [], summary: Rotate refresh token, responses: { "200": { description: tokens } } }
  /me:
    get: { tags: [auth], summary: Current user + memberships, responses: { "200": { description: profile } } }
  /tenants/{tenant_id}/switch:
    parameters: [{ name: tenant_id, in: path, required: true, schema: { type: string } }]
    post: { tags: [auth], summary: Switch active tenant (CA console), responses: { "200": { description: new token } } }

  /books/transactions:
    get: { tags: [books], summary: Normalized bank feed (cursor paginated), responses: { "200": { description: page } } }
  /books/imports:
    post: { tags: [books], summary: Upload statement/export file → 202 + run_id, responses: { "202": { description: queued } } }
  /books/imports/tally:
    post:
      tags: [books]
      summary: Pull outstanding receivables+payables through the Tally HTTP-XML connector (fixture or live mode; mode echoed in the response)
      responses: { "200": { description: sync summary } }
  /books/onboarding:
    post:
      tags: [books]
      summary: A1 onboarding — import Tally/Zoho invoice export; seeds payment history into memory
      responses: { "201": { description: import summary } }
  /books/exceptions:
    get: { tags: [books], summary: Unmatched residuals queue, responses: { "200": { description: page } } }
  /books/chart-of-accounts:
    get: { tags: [books], summary: Tenant chart of accounts, responses: { "200": { description: accounts } } }
  /books/transactions/{txn_id}/category:
    parameters: [{ name: txn_id, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [books]
      summary: Human category correction — also writes a vendor_category memory claim
      responses: { "200": { description: corrected } }
  /reports/month-end:
    get: { tags: [books], summary: Month-end pack for a period, responses: { "200": { description: pack } } }

  /agent/runs:
    post: { tags: [agent], summary: Start a graph run (kind + params) → run_id, responses: { "202": { description: queued } } }
    get: { tags: [agent], summary: List runs, responses: { "200": { description: page } } }
  /agent/runs/{run_id}:
    parameters: [{ name: run_id, in: path, required: true, schema: { type: string } }]
    get: { tags: [agent], summary: Run status + steps, responses: { "200": { description: run } } }
  /agent/runs/{run_id}/stream:
    parameters: [{ name: run_id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [agent]
      summary: SSE stream of run events (shapes in contracts/events.md)
      responses: { "200": { description: text/event-stream } }
  /agent/runs/{run_id}/cancel:
    parameters: [{ name: run_id, in: path, required: true, schema: { type: string } }]
    post: { tags: [agent], summary: Cancel a run, responses: { "200": { description: cancelled } } }
  /agent/health:
    get:
      tags: [agent]
      summary: Live subsystem health — worker consumer liveness + memory-engine reachability
      responses: { "200": { description: "{worker: bool, memory: bool}" } }

  /conflicts:
    get: { tags: [conflicts], summary: Conflict cards (filter by status), responses: { "200": { description: page } } }
  /conflicts/{conflict_id}/resolve:
    parameters: [{ name: conflict_id, in: path, required: true, schema: { type: string } }]
    post: { tags: [conflicts], summary: One-tap resolution (winning claim + rationale), responses: { "200": { description: resolved } } }

  /anomalies:
    get: { tags: [anomalies], summary: Anomaly cards, responses: { "200": { description: page } } }
  /anomalies/{anomaly_id}/decide:
    parameters: [{ name: anomaly_id, in: path, required: true, schema: { type: string } }]
    post: { tags: [anomalies], summary: accept | dismiss | mark recovered, responses: { "200": { description: updated } } }

  /approvals:
    get: { tags: [approvals], summary: Approval queue, responses: { "200": { description: page } } }
  /approvals/{approval_id}/decide:
    parameters: [{ name: approval_id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [approvals]
      summary: Approve/reject; on approve mints single-use action token and resumes the run
      responses: { "200": { description: decided } }

  /forecast:
    get: { tags: [cash], summary: Latest forecast (scenarios + lines + drivers), responses: { "200": { description: forecast } } }
  /forecast/whatif:
    post:
      tags: [cash]
      summary: Deterministic what-if on the stored base scenario (collection delay, inflow haircut, extra outflow) — server computes, UI only renders
      responses: { "200": { description: adjusted weeks + gap } }
  /receivables/{invoice_id}/promise:
    parameters: [{ name: invoice_id, in: path, required: true, schema: { type: string } }]
    post: { tags: [cash], summary: "Log a client's promise-to-pay; settlement classifies kept/broken deterministically when recon marks the invoice paid (F3 outcome loop)", responses: { "201": { description: created } } }
  /receivables/radar:
    get: { tags: [cash], summary: "45-day clocks, accrued interest, escalation states", responses: { "200": { description: radar } } }
  /books/counterparties/{party_id}/verify-msme:
    parameters: [{ name: party_id, in: path, required: true, schema: { type: string } }]
    post: { tags: [books], summary: "Verify a vendor's Udyam URN (fixture register today) — verified category then scopes §15/43B(h); tag kept alongside, disagreement = drift alert", responses: { "200": { description: verification } } }
  /payables/compliance:
    get: { tags: [cash], summary: "Buyer-side MSE payables — §15 clock, §16 interest owed, 43B(h) disallowance exposure per open bill", responses: { "200": { description: compliance } } }
  /payables/plan:
    get: { tags: [cash], summary: "Deduction Defense — deterministic ranked pay-first plan (closing windows by deadline, breached by daily §16 bleed), cash-aware via latest forecast", responses: { "200": { description: plan } } }
  /ims/sync:
    post: { tags: [ims], summary: "Pull the tenant's IMS queue (fixture GSP today) and re-run the deterministic 3-way match + recommendation; decided states are terminal for sync", responses: { "200": { description: counts } } }
  /ims/queue:
    get: { tags: [ims], summary: "IMS triage queue — records with match tier / recommendation / evidence note + ITC-at-stake totals", responses: { "200": { description: queue } } }
  /ims/records/{record_id}/action:
    parameters: [{ name: record_id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [ims]
      summary: Request accept/reject on one record — queues a maker-checker approval; execution only via decide with a minted token (never direct)
      responses: { "200": { description: queued } }

  /wc-actions:
    get: { tags: [cash], summary: Ranked working-capital options, responses: { "200": { description: page } } }
  /wc-actions/{action_id}/request:
    parameters: [{ name: action_id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [cash]
      summary: Move a proposed action into the approval queue (treds only; collect routes via collections)
      responses: { "200": { description: queued } }

  /dataroom/export:
    get: { tags: [trust], summary: "Credit pack zip — summary.md (score + audit head hash) + receivables/payables/forecast CSVs, all deterministic", responses: { "200": { description: zip } } }
  /audit/verify:
    get: { tags: [trust], summary: "Recompute the tenant's hash-chained audit log live — {valid, entries, head_hash, broken_at?}", responses: { "200": { description: verification } } }
  /dataroom:
    get: { tags: [cash], summary: Credit-ready data room — FinDesk Score + verified evidence, responses: { "200": { description: room } } }
  /dataroom/share:
    post: { tags: [cash], summary: Mint an expiring read-only lender share link (owner/CA only), responses: { "200": { description: token } } }
  /dataroom/shared:
    get:
      tags: [cash]
      security: []
      summary: Lender-facing read-only view (signed share token is the credential)
      responses: { "200": { description: room } }

  /why/{entity_type}/{entity_id}:
    parameters: [{ name: entity_type, in: path, required: true, schema: { type: string } }, { name: entity_id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [why]
      summary: Composed evidence chain (app provenance + memory why-chain)
      responses: { "200": { description: evidence trail } }

  /webhooks/aa/consent:
    post: { tags: [webhooks], security: [], summary: Account Aggregator consent callback (signed), responses: { "200": { description: ok } } }
  /webhooks/email/events:
    post: { tags: [webhooks], security: [], summary: Email delivery/open/reply events (signed), responses: { "200": { description: ok } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
