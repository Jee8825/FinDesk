[project]
name = "findesk-shared"
version = "0.1.0"
description = "FinDesk cross-layer utilities + generated contract models"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["findesk_shared", "findesk_contracts"]

[tool.ruff]
line-length = 100
target-version = "py311"
