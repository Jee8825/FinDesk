name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,qwen]"
      - name: Lint (ruff)
        run: ruff check recall tests benchmarks
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Integration tests (testcontainers)
        # Ubuntu runners ship Docker; testcontainers spins up Postgres/Neo4j.
        run: pytest tests/integration -q -m integration

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[bench]"
      - name: Run benchmarks
        run: python -m benchmarks.run_all
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-charts
          path: benchmarks/output/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run build
