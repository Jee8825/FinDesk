# Recall — one-command local stack.
#   docker compose up                 → core engine (postgres, neo4j, redis, api, frontend)
#   docker compose --profile obs up   → also start Langfuse observability
name: recall

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: recall
      POSTGRES_DB: recall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/recall-neo4j
      NEO4J_server_memory_pagecache_size: 256M
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    env_file: .env
    environment:
      RECALL_POSTGRES_DSN: postgresql+asyncpg://recall:recall@postgres:5432/recall
      RECALL_NEO4J_URI: bolt://neo4j:7687
      RECALL_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      # FinDesk fix: the image build omits prompts/ but recall.core.prompts
      # resolves /app/prompts — mount them read-only (also live-tweakable in dev)
      - ./prompts:/app/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  # --- Observability (optional: --profile obs) ---
  langfuse-db:
    image: postgres:16-alpine
    profiles: ["obs"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfusedata:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    profiles: ["obs"]
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: local-dev-secret
      SALT: local-dev-salt
      NEXTAUTH_URL: http://localhost:3001
    ports:
      - "3001:3000"
    depends_on:
      - langfuse-db

volumes:
  pgdata:
  neo4jdata:
  langfusedata:
