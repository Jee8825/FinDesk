[project]
name = "recall"
version = "0.1.0"
description = "Recall — a living memory engine for LLM agents. Memory that decays, reinforces, and self-organizes rather than accumulating indefinitely."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Recall Team" }]
keywords = ["llm", "agents", "memory", "rag", "qwen", "vector-search"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "neo4j>=5.26",
    "redis>=5.2",
    "httpx>=0.28",
    "tenacity>=9.0",
    "numpy>=2.0",
    "tiktoken>=0.8",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "orjson>=3.10",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
qwen = ["dashscope>=1.20"]
openai = ["openai>=1.55"]
anthropic = ["anthropic>=0.40"]
local = ["openai>=1.55"]  # local servers (Ollama/vLLM) expose an OpenAI-compatible API
adapters = ["langgraph>=0.2.50", "langchain-core>=0.3", "pyautogen>=0.4"]
observability = ["langfuse>=2.53", "opentelemetry-sdk>=1.28"]
bench = ["matplotlib>=3.9", "pandas>=2.2", "datasets>=3.1"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "testcontainers[postgres,neo4j,redis]>=4.8",
    "httpx>=0.28",
]

[project.scripts]
recall = "recall.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recall"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["recall", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI uses function calls in defaults (Depends)

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: requires live Postgres/Neo4j/Redis (testcontainers)",
    "e2e: full end-to-end smoke tests",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
