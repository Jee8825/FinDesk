name: nightly

on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST nightly
  workflow_dispatch: {}
  pull_request:
    paths:
      - "agents/findesk_agents/graphs/reconciliation/**"
      - "infra/observability/evals/**"
      - "backend/tests/integration/**"

jobs:
  recon-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ./shared/py ./agents
      - name: Reconciliation accuracy harness
        run: python infra/observability/evals/run_recon_eval.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recon-eval-report
          path: infra/observability/evals/evals_out/recon_eval.json

  integration:
    # real Postgres via testcontainers: guardrails, tenancy, audit-chain tamper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ./shared/py ./tools -e './backend[dev]'
      - name: Integration suite
        run: cd backend && python -m pytest tests/integration -q -m integration
