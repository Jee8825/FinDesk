name: e2e-nightly

# Full-stack Playwright smoke: postgres + redis services, migrated +
# seeded backend, live agents worker, Next dev server — the same suite
# developers run locally via `make test-e2e`. Recall (memory stack) is
# NOT booted here; specs that need it skip under E2E_LITE=1.
on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST nightly
  workflow_dispatch:
  push:
    branches: [feat/design-v2] # TEMP: proving run — removed before merge

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: findesk
          POSTGRES_PASSWORD: findesk
          POSTGRES_DB: findesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U findesk" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20

    env:
      APP_DATABASE_URL: postgresql+asyncpg://findesk:findesk@localhost:5432/findesk
      APP_REDIS_URL: redis://localhost:6379/0
      RECALL_BASE_URL: http://localhost:59999 # dead on purpose — degrades gracefully
      E2E_LITE: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Install python workspaces
        run: |
          # local packages resolve in dependency order: shared → tools → backend → agents
          pip install -e ./shared/py
          for ws in tools backend agents; do
            pip install -e "./$ws[dev]" 2>/dev/null || pip install -e "./$ws"
          done

      - name: Migrate + seed
        run: |
          (cd backend && alembic upgrade head)
          python scripts/seed_dev_data.py

      - name: Start backend + worker
        run: |
          nohup uvicorn app.main:app --port 8080 > backend.log 2>&1 &
          nohup python -m findesk_agents.worker > worker.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz && break; sleep 2; done
          curl -sf http://localhost:8080/healthz

      - name: Install frontend + browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright suite
        working-directory: frontend
        run: npx playwright test

      - name: Surface service logs on failure
        if: failure()
        run: |
          echo "== backend =="; tail -50 backend.log || true
          echo "== worker =="; tail -50 worker.log || true

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
