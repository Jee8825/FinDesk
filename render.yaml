# Render Blueprint — FinDesk / LeakRadar, tuned for the FREE tier.
#
# ONE web service runs both the API and the agents worker (infra/Dockerfile.render).
# That is not a shortcut for its own sake: Render background workers are a PAID
# service, so on the free tier a separate worker cannot exist — and without a
# worker every agent run sits at "queued" forever, which is the entire product.
#
# The free tier also gives 750 instance-hours/month. A single always-on service
# uses ~730, so ONE service can stay awake round the clock; two cannot.
#
# The frontend is not here — it goes to Vercel and proxies /api/v1/* to this
# service via next.config.mjs rewrites, so everything is same-origin with no CORS.
#
# Moving past a demo: swap to backend/Dockerfile + agents/Dockerfile as two
# services (a `type: worker` entry on a paid plan). Separate scaling, separate
# restarts, and a worker crash can no longer take the API down with it.
#
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
# See DEPLOY.md for the full walkthrough, including UptimeRobot.

databases:
  - name: findesk-postgres
    databaseName: findesk
    user: findesk
    plan: free          # NOTE: free Postgres is deleted after 30 days
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: findesk-redis
    plan: free
    ipAllowList: []               # private network only
    maxmemoryPolicy: noeviction   # job streams must not be evicted under pressure

  - type: web
    name: findesk-api
    runtime: docker
    plan: free
    dockerfilePath: ./infra/Dockerfile.render
    dockerContext: .    # the image COPYs shared/, tools/, agents/ and backend/
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    # KEEP AT 1. The API persists agent run steps by consuming the agents:events
    # Redis stream through a single consumer group, so a second replica splits
    # the stream and each instance records only what it happened to receive —
    # the Run Viewer then shows steps stuck at "started". Measured: two backends
    # lost 2 of 9 steps on a scan; one recorded all 9. Scaling out needs a
    # per-replica consumer name first. (Free tier is single-instance anyway.)
    numInstances: 1
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DATABASE_URL
        fromDatabase:
          name: findesk-postgres
          property: connectionString   # plain URL; settings add the +asyncpg driver
      - key: APP_REDIS_URL
        fromService:
          name: findesk-redis
          type: keyvalue
          property: connectionString
      # The worker runs in this same container and calls the API over loopback.
      - key: BACKEND_BASE_URL
        value: http://localhost:8080
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_TOKEN
        generateValue: true
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "14"
      - key: STATUTORY_BANK_RATE_BPS
        value: "675"
      # Optional. No key = deterministic-only: vendor names fall back to the
      # slug, narratives and drafts are simply absent, every number is unchanged.
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Optional. Leave blank unless you deploy Recall (DEPLOY.md §7) — the
      # usage-confirmation answer lives on the subscriptions row, so LeakRadar's
      # loop works without a memory engine.
      - key: RECALL_BASE_URL
        sync: false
