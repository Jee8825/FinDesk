[project]
name = "findesk-tools"
version = "0.1.0"
description = "FinDesk tool layer — typed connectors per contracts/tools.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "findesk-shared",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["findesk_tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
